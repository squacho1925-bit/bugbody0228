<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>悠活手調工作室 ｜ 記帳與薪資系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC;
  --surface:#FFFFFF;
  --surface-alt:#EFEADD;
  --ink:#243029;
  --ink-soft:#647268;
  --ink-faint:#9AA69C;
  --primary:#38574A;
  --primary-dark:#233A31;
  --primary-soft:#DCE7DF;
  --accent:#BD8A3F;
  --accent-soft:#F1E3C7;
  --accent-dark:#8F672B;
  --teal:#6E948A;
  --danger:#B1544A;
  --danger-soft:#F5DEDA;
  --success:#3E7A55;
  --success-soft:#DDEEE2;
  --border:#E3DCC9;
  --shadow-sm:0 1px 3px rgba(35,58,49,.08);
  --shadow-md:0 8px 24px rgba(35,58,49,.14);
  --radius:12px;
  --radius-sm:8px;
  --font-display:'Noto Serif TC', serif;
  --font-body:'Noto Sans TC', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit; font-size:14px;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--primary-dark);}
a{color:inherit;}
::selection{background:var(--accent-soft);}

/* ---------- layout shell ---------- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex-shrink:0; background:var(--primary-dark); color:#EFE9DA;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{padding:22px 18px 20px; border-bottom:1px solid rgba(239,233,218,.12); text-align:center;}
.brand-logo-card{background:#F1EEE6; border-radius:14px; padding:12px 10px 10px; margin:0 auto 12px; box-shadow:0 4px 14px rgba(0,0,0,.18);}
.brand-logo-img{width:100%; height:auto; display:block; border-radius:6px;}
.brand h1{font-size:16px; color:#FBF8F0; line-height:1.35; letter-spacing:.02em; font-weight:600;}
.brand p{margin:5px 0 0; font-size:10.5px; color:#8FA096; letter-spacing:.04em;}
nav.navlist{padding:14px 10px; flex:1;}
.navlist button{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  background:transparent; border:none; color:#D7DDD3; padding:10px 12px; margin-bottom:2px;
  border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:background .15s, color .15s;
}
.navlist button svg{flex-shrink:0; opacity:.85;}
.navlist button:hover{background:rgba(239,233,218,.08); color:#fff;}
.navlist button.active{background:var(--accent); color:var(--primary-dark); font-weight:700;}
.navlist button.active svg{opacity:1;}
.sidebar-foot{padding:14px 18px 20px; font-size:11px; color:#8FA096; border-top:1px solid rgba(239,233,218,.12);}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:20; background:rgba(246,243,236,.9); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:12px;
}
#topbar h2{font-size:21px;}
#topbar .sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
#content{padding:24px 28px 64px; flex:1;}
.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ---------- generic components ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.card-pad{padding:20px 22px;}
.section-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
.section-head h3{font-size:17px;}
.section-head .desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; border-radius:8px;
  padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent); color:var(--primary-dark);}
.btn-accent:hover{background:var(--accent-dark); color:#fff;}
.btn-ghost{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-danger:hover{background:var(--danger); color:#fff;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.icon-btn{background:transparent; border:1px solid var(--border); border-radius:6px; padding:5px 7px; cursor:pointer; color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-alt); color:var(--ink);}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{padding:18px 20px; position:relative; overflow:hidden;}
.stat-card .label{font-size:12px; color:var(--ink-soft); font-weight:600; letter-spacing:.02em;}
.stat-card .value{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--primary-dark); margin-top:6px;}
.stat-card .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.stat-card .tag{position:absolute; top:14px; right:14px; font-size:10px; padding:3px 8px; border-radius:20px; font-weight:700;}
.tag-good{background:var(--success-soft); color:var(--success);}
.tag-warn{background:var(--accent-soft); color:var(--accent-dark);}

table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
  border-bottom:1px solid var(--border); padding:9px 10px; background:var(--surface-alt); font-weight:700;
  position:sticky; top:0;
}
thead th:first-child{border-top-left-radius:8px;}
thead th:last-child{border-top-right-radius:8px;}
tbody td{padding:10px 10px; border-bottom:1px solid var(--border); color:var(--ink); vertical-align:middle;}
tbody tr:hover{background:#FBF9F3;}
tbody tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.table-wrap table{min-width:640px;}
.empty-row td{text-align:center; color:var(--ink-faint); padding:36px 10px; font-size:13px;}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.center{text-align:center;}

.pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
.pill-A{background:#E4D6F5; color:#6B3FA0;}
.pill-B{background:#D6E8F5; color:#2E6FA3;}
.pill-C{background:#FBE6C4; color:#95661A;}
.pill-D{background:#E4E9DF; color:#54634F;}
.pill-service{background:var(--primary-soft); color:var(--primary);}
.pill-good{background:var(--success-soft); color:var(--success);}
.pill-mute{background:var(--surface-alt); color:var(--ink-soft);}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.field .help{font-size:11px; color:var(--ink-faint); font-weight:400;}
input[type=text], input[type=number], input[type=date], input[type=month], input[type=tel], input[type=password], select, textarea{
  border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:#fff; color:var(--ink); width:100%;
}
input:focus, select:focus, textarea:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
textarea{resize:vertical; min-height:60px;}
input[type=file]{border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:#fff; width:100%; font-size:13px;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){.form-row{grid-template-columns:1fr;}}
.check-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
.check-row input{width:auto;}

.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:16px;}
.toolbar .field{margin-bottom:0; min-width:140px;}
.toolbar .field.grow{flex:1; min-width:180px;}

.search-input{position:relative;}
.autocomplete-list{margin-top:4px; border:1px solid var(--border); border-radius:8px; background:#fff; max-height:220px; overflow-y:auto; box-shadow:var(--shadow-sm);}
.autocomplete-item{padding:8px 10px; cursor:pointer; border-bottom:1px solid var(--border);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover{background:var(--surface-alt);}
.autocomplete-item .ac-name{font-weight:600; color:var(--ink); font-size:13px;}
.autocomplete-item .ac-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.autocomplete-empty{padding:10px; font-size:12.5px; color:var(--ink-faint); text-align:center;}
.badge-count{background:var(--accent-soft); color:var(--accent-dark); border-radius:20px; padding:2px 9px; font-size:11.5px; font-weight:700;}

/* modal */
#modalOverlay{
  position:fixed; inset:0; background:rgba(35,50,42,.45); display:none; align-items:flex-start; justify-content:center;
  padding:5vh 16px; z-index:100; overflow-y:auto;
}
#modalOverlay.open{display:flex;}
.modal-box{background:#fff; border-radius:14px; width:100%; max-width:560px; box-shadow:var(--shadow-md); animation:modalin .18s ease;}
.modal-box.wide{max-width:760px;}
@keyframes modalin{from{opacity:0; transform:translateY(-8px) scale(.98);} to{opacity:1; transform:none;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:17px;}
.modal-body{padding:20px 22px; max-height:66vh; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
.modal-close:hover{color:var(--ink);}

/* toast */
#toastStack{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  background:var(--primary-dark); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px; box-shadow:var(--shadow-md);
  display:flex; align-items:center; gap:8px; max-width:320px; animation:toastin .2s ease;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.toast.info{background:var(--primary);}
@keyframes toastin{from{opacity:0; transform:translateX(12px);} to{opacity:1; transform:none;}}

.divider{height:1px; background:var(--border); margin:18px 0;}
.note-box{background:var(--accent-soft); border:1px solid #E6CE9A; color:var(--accent-dark); padding:12px 14px; border-radius:9px; font-size:12.5px; line-height:1.6;}
.info-box{background:var(--primary-soft); border:1px solid #C6D8CC; color:var(--primary-dark); padding:12px 14px; border-radius:9px; font-size:12.5px; line-height:1.6;}
.small-btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.mono{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint); font-size:11.5px;}
.hidden{display:none !important;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}
.mb8{margin-bottom:8px;}
.flex{display:flex;} .flex-wrap{flex-wrap:wrap;} .gap8{gap:8px;} .gap10{gap:10px;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.w-100{width:100%;}
.pagination{display:flex; align-items:center; justify-content:center; gap:10px; padding:14px 0 4px; font-size:13px; color:var(--ink-soft);}

.chart-wrap{padding:6px 4px 0;}
.chart-legend{display:flex; gap:16px; font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
.legend-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px;}

@media (max-width:900px){
  #sidebar{position:fixed; left:-236px; z-index:90; transition:left .2s;}
  #sidebar.open{left:0;}
  #main{width:100%;}
  #topbar{padding:14px 16px;}
  #content{padding:16px 16px 48px;}
  #menuToggle{display:inline-flex !important;}
}
#menuToggle{display:none; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:8px 10px; cursor:pointer;}
</style>

const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);
function toB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function fromB64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
async function sha256B64(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return toB64(buf);
}
async function hashPassword(password, saltB64){
  let h = saltB64 + ":" + password;
  for(let i=0;i<3000;i++){ h = await sha256B64(h); }
  return h;
}
function randomSaltB64(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return toB64(arr);
}
function normalizeAnswer(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
function clearFormFields(formId){
  const form = document.getElementById(formId);
  if(!form) return;
  form.querySelectorAll("input[type=text], input[type=tel], input[type=number], input[type=date], input[type=password], textarea").forEach(el=>{ el.value=""; });
  form.querySelectorAll("select").forEach(el=>{ el.selectedIndex = 0; });
  const first = form.querySelector("input, select, textarea");
  if(first) first.focus();
}

/* ---- Excel 範本下載／批次匯入 共用工具 ---- */
function downloadXlsxTemplate(headers, sampleRow, filename, sheetName){
  if(typeof XLSX === "undefined"){ toast("目前無法使用 Excel 功能，請確認網路連線後重新整理頁面","error"); return; }
  const wsData = [headers];
  if(sampleRow) wsData.push(sampleRow);
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = headers.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "工作表1");
  XLSX.writeFile(wb, filename);
}
function readExcelFile(file){
  return new Promise((resolve, reject)=>{
    if(typeof XLSX === "undefined"){ reject(new Error("尚未載入 Excel 功能，請確認網路連線後重新整理頁面")); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:"array", cellDates:true});
        const wsName = wb.SheetNames[0];
        const ws = wb.Sheets[wsName];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.onerror = ()=> reject(new Error("讀取檔案失敗"));
    reader.readAsArrayBuffer(file);
  });
}
function pickField(row, keys){
  for(const k of keys){ if(row[k]!==undefined && String(row[k]).trim()!=="") return String(row[k]).trim(); }
  return "";
}
function mapImportedCustomerRow(row){
  const name = pickField(row, ["姓名","客戶姓名","Name","name"]);
  const code = pickField(row, ["編號","客戶編號","Code","code"]);
  const phone = pickField(row, ["連絡電話","電話","手機","Phone","phone"]);
  const gender = pickField(row, ["性別","Gender"]);
  const occupation = pickField(row, ["工作","職業","Occupation"]);
  const birthYear = pickField(row, ["出生西元年","出生年","西元年","Birth Year"]);
  const birthDate = pickField(row, ["完整生日","生日","Birth Date","birthDate"]);
  const referrer = pickField(row, ["轉介人","介紹人","Referrer","referrer"]);
  const pillowInfo = pickField(row, ["枕頭(高度/頭型)","枕頭","Pillow"]);
  const note = pickField(row, ["備註(EX:孕婦,外國人…)","備註","Note","note"]);
  return {name, code, phone, gender, occupation, birthYear, birthDate, referrer, pillowInfo, note};
}
function mapImportedTherapistRow(row){
  const name = pickField(row, ["姓名","調理師姓名","Name","name"]);
  let level = pickField(row, ["等級(A/B/C/D)","等級","Level","level"]).toUpperCase();
  if(!LEVELS.includes(level)) level = "";
  const phone = pickField(row, ["電話","手機","Phone","phone"]);
  const joinDate = pickField(row, ["到職日(YYYY-MM-DD)","到職日","Join Date","joinDate"]);
  const statusText = pickField(row, ["狀態(在職/停用)","狀態","Status","status"]);
  const status = statusText === "停用" ? "inactive" : "active";
  const note = pickField(row, ["備註","Note","note"]);
  return {name, level, phone, joinDate, status, note};
}
function parseImportDate(v){
  if(v===undefined || v===null || v==="") return "";
  if(v instanceof Date && !isNaN(v.getTime())){
    const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  let s = String(v).trim().replace(/\//g,'-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return "";
}
function findItemByNameCategory(category, name){
  name = (name||"").trim().replace(/\s/g,"");
  if(!name) return null;
  let pool = state.items;
  if(category) pool = pool.filter(i=>i.category===category);
  return pool.find(i=> i.name.replace(/\s/g,"")===name) || null;
}
function findTherapistByName(name){
  name = (name||"").trim();
  if(!name) return null;
  return state.therapists.find(t=>t.name===name) || null;
}
function findCustomerByCodeOrName(text){
  text = (text||"").trim();
  if(!text) return null;
  return state.customers.find(c=>c.code && c.code===text) || state.customers.find(c=>c.name===text) || null;
}
function mapImportedTransactionRow(row){
  const dateRaw = row["日期(YYYY-MM-DD)"] !== undefined ? row["日期(YYYY-MM-DD)"] : pickField(row, ["日期","Date","date"]);
  const date = parseImportDate(dateRaw);
  const categoryRaw = pickField(row, ["類別(服務/商品/其他)","類別","Category"]);
  const category = CATEGORIES.includes(categoryRaw) ? categoryRaw : "";
  const itemName = pickField(row, ["項目","Item","item"]);
  const item = findItemByNameCategory(category, itemName);
  const custText = pickField(row, ["客戶(姓名或編號，可留空＝現場客)","客戶(姓名或編號)","客戶","Customer"]);
  const customer = findCustomerByCodeOrName(custText);
  const therapistName = pickField(row, ["調理師","Therapist"]);
  const therapist = findTherapistByName(therapistName);
  let customerType = pickField(row, ["客戶類別(一般/選手，僅調理項目適用)","客戶類別","CustomerType"]);
  customerType = customerType === "選手" ? "選手" : "一般";
  const qty = Number(pickField(row, ["數量","Qty","qty"])) || 1;
  let unitPriceRaw = pickField(row, ["單價(可留空由系統試算)","單價","UnitPrice"]);
  let discount = Number(pickField(row, ["折扣","Discount"])) || 0;
  let amountRaw = pickField(row, ["金額(可留空自動計算)","金額","Amount"]);
  let payment = pickField(row, ["付款方式","Payment"]);
  if(!PAYMENTS.includes(payment)) payment = "現金";
  const note = pickField(row, ["備註","Note","note"]);

  let reason = "";
  if(!date) reason = "日期格式錯誤或空白";
  else if(!category) reason = "類別需為「服務／商品／其他」其中之一";
  else if(!item) reason = "找不到符合類別的項目名稱";
  if(reason) return {ok:false, reason};

  let unitPrice = unitPriceRaw==="" ? NaN : Number(unitPriceRaw);
  if(isNaN(unitPrice)){
    unitPrice = unitPriceFor(item.id, therapist?therapist.id:"", item.id==="it_tiao"?customerType:"");
  }
  let amount = amountRaw==="" ? NaN : Number(amountRaw);
  if(isNaN(amount)){
    amount = clamp0(unitPrice*qty - discount);
  }

  return {
    ok:true,
    date, category, itemId:item.id, itemName:item.name,
    customerId: customer?customer.id:"", customerName: customer?customer.name:custText,
    therapistId: therapist?therapist.id:"", therapistName: therapist?therapist.name:"",
    customerType: item.id==="it_tiao" ? customerType : "",
    qty, unitPrice, discount, amount, payment, note:note||"",
    customerMatched: custText ? !!customer : true,
    therapistMatched: therapistName ? !!therapist : true,
  };
}
function openImportModal(kind){
  const label = kind === "customer" ? "客戶" : (kind === "therapist" ? "調理師" : "消費紀錄");
  let parsedValid = [];
  openModal({
    title: `批次匯入${label}資料（Excel）`,
    wide:true,
    bodyHTML: `
      <div class="note-box mb8">請先點選下方「下載空白範本」取得正確欄位格式，填寫完成後於此上傳（支援 .xlsx／.xls／.csv）。</div>
      <div class="field"><label>選擇檔案</label><input type="file" id="importXlsxInput" accept=".xlsx,.xls,.csv"></div>
      <div id="importPreviewArea"></div>
    `,
    footHTML: `<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary hidden" id="importConfirmBtn">確認匯入</button>`,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("importXlsxInput").addEventListener("change", async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        try{
          const rows = await readExcelFile(file);
          const mapped = rows.map(r => {
            if(kind==="customer") return mapImportedCustomerRow(r);
            if(kind==="therapist") return mapImportedTherapistRow(r);
            return mapImportedTransactionRow(r);
          });
          const valid = [], invalid = [];
          mapped.forEach((m, idx)=>{
            if(kind==="customer"){
              if(m.name) valid.push(m); else invalid.push({idx:idx+2, reason:"缺少姓名"});
            } else if(kind==="therapist"){
              if(m.name && m.level) valid.push(m);
              else invalid.push({idx:idx+2, reason: !m.name ? "缺少姓名" : "等級需為 A / B / C / D"});
            } else {
              if(m.ok) valid.push(m); else invalid.push({idx:idx+2, reason:m.reason});
            }
          });
          parsedValid = valid;
          renderImportPreview(valid, invalid, kind);
          document.getElementById("importConfirmBtn").classList.toggle("hidden", valid.length===0);
        }catch(err){
          toast("讀取失敗："+err.message, "error");
        }
      });
      document.getElementById("importConfirmBtn").addEventListener("click", ()=>{
        commitImport(kind, parsedValid);
        closeModal();
      });
    }
  });
}
function renderImportPreview(valid, invalid, kind){
  const area = document.getElementById("importPreviewArea");
  const cols = kind==="customer"
    ? [["姓名","name"],["編號","code"],["電話","phone"],["性別","gender"],["工作","occupation"],["出生年","birthYear"],["生日","birthDate"],["轉介人","referrer"],["枕頭","pillowInfo"],["備註","note"]]
    : kind==="therapist"
    ? [["姓名","name"],["等級","level"],["電話","phone"],["到職日","joinDate"],["狀態","status"],["備註","note"]]
    : [["日期","date"],["客戶","customerName"],["類別","category"],["項目","itemName"],["調理師","therapistName"],["數量","qty"],["單價","unitPrice"],["折扣","discount"],["金額","amount"],["付款","payment"]];
  let extraNote = "";
  if(kind==="transaction"){
    const custWarn = valid.filter(r=>!r.customerMatched).length;
    if(custWarn) extraNote += `<div class="faint mt8">有 ${custWarn} 筆客戶未在主檔中比對到，將以文字方式記錄為現場客。</div>`;
  }
  area.innerHTML = `
    <div class="mt12 flex gap10" style="flex-wrap:wrap;">
      <span class="badge-count">可匯入 ${valid.length} 筆</span>
      ${invalid.length ? `<span class="badge-count" style="background:var(--danger-soft); color:var(--danger);">${invalid.length} 筆有誤，將略過</span>` : ""}
    </div>
    <div class="table-wrap mt8" style="max-height:280px; overflow:auto;">
      <table>
        <thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead>
        <tbody>
          ${valid.slice(0,50).map(r=>`<tr>${cols.map(c=>{
            let v = r[c[1]];
            if(c[1]==="status") v = (v==="inactive") ? "停用" : "在職";
            if(c[1]==="unitPrice" || c[1]==="amount" || c[1]==="discount") v = (v!==undefined && v!==null) ? fmtNum(v) : v;
            return `<td>${escapeHtml(v||'')}</td>`;
          }).join("")}</tr>`).join("") || `<tr class="empty-row"><td colspan="${cols.length}">沒有可匯入的資料</td></tr>`}
        </tbody>
      </table>
    </div>
    ${valid.length>50 ? `<div class="faint mt8">僅預覽前 50 筆，確認匯入後會套用全部 ${valid.length} 筆</div>` : ""}
    ${invalid.length ? `<div class="faint mt8">已略過（Excel 列號）：${invalid.slice(0,20).map(i=>`第${i.idx}列(${escapeHtml(i.reason)})`).join("、")}${invalid.length>20?" …":""}</div>` : ""}
    ${extraNote}
  `;
}
function commitImport(kind, rows){
  if(rows.length===0){ toast("沒有可匯入的資料","error"); return; }
  let added=0, skipped=0;
  if(kind==="customer"){
    rows.forEach(r=>{
      const dup = state.customers.find(c=> c.name===r.name && (r.phone ? c.phone===r.phone : true));
      if(dup){ skipped++; return; }
      state.customers.push({id:uid("cu"), name:r.name, code:r.code||"", phone:r.phone||"", gender:r.gender||"", occupation:r.occupation||"",
        birthYear:r.birthYear||"", birthDate:r.birthDate||"", referrer:r.referrer||"", pillowInfo:r.pillowInfo||"", note:r.note||""});
      added++;
    });
    saveState();
    toast(`已匯入 ${added} 筆客戶${skipped?`，略過 ${skipped} 筆重複`:''}`, "success");
    if(activeTab==="customers") renderCustomerTable();
  } else if(kind==="therapist"){
    rows.forEach(r=>{
      const dup = state.therapists.find(t=> t.name===r.name);
      if(dup){ skipped++; return; }
      state.therapists.push({id:uid("th"), name:r.name, level:r.level, phone:r.phone||"", joinDate:r.joinDate||todayStr(), status:r.status||"active", note:r.note||""});
      added++;
    });
    saveState();
    toast(`已匯入 ${added} 筆調理師${skipped?`，略過 ${skipped} 筆重複`:''}`, "success");
    if(activeTab==="therapists") renderTherapists();
  } else {
    rows.forEach(r=>{
      state.transactions.push({
        id: uid("tx"), date:r.date, customerId:r.customerId||"", customerName:r.customerName||"",
        therapistId:r.therapistId||"", therapistName:r.therapistName||"",
        category:r.category, itemId:r.itemId, itemName:r.itemName, customerType:r.customerType||"",
        qty:r.qty, unitPrice:r.unitPrice, discount:r.discount, amount:r.amount, payment:r.payment, note:r.note||"",
      });
      added++;
    });
    saveState();
    toast(`已匯入 ${added} 筆消費紀錄`, "success");
    if(activeTab==="transactions") renderTxTable();
    if(activeTab==="dashboard") renderDashboard();
  }
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.items) return defaultState();
    if(!parsed.meta) parsed.meta = {studioName:"悠活手調工作室", tagline:"NORMCORE"};
    if(!parsed.meta.tagline) parsed.meta.tagline = "NORMCORE";
    if(!parsed.security) parsed.security = {hash:null, salt:null, hint:"", question:"", qHash:null, qSalt:null};
    if(parsed.security.hint===undefined) parsed.security.hint = "";
    if(parsed.security.question===undefined) parsed.security.question = "";
    if(parsed.security.qHash===undefined) parsed.security.qHash = null;
    if(parsed.security.qSalt===undefined) parsed.security.qSalt = null;
    if(Array.isArray(parsed.therapists)){
      parsed.therapists.forEach(t=>{
        if(t.pinHash===undefined) t.pinHash = null;
        if(t.pinSalt===undefined) t.pinSalt = null;
      });
    }
    return parsed;
  }catch(e){
    console.error("讀取本機資料失敗，改用預設範例資料", e);
    return defaultState();
  }
}
function saveState(){
  state.meta.updatedAt = new Date().toISOString();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    toast("儲存失敗：瀏覽器儲存空間可能已滿", "error");
  }
}

function toast(msg, type){
  type = type || "info";
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  document.getElementById("toastStack").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(()=>el.remove(), 300); }, 2800);
}

let modalOnClose = null;

}

   5. 計算輔助（定價 / 分潤）

function unitPriceFor(itemId, therapistId, customerType){
  const item = byId(state.items, itemId);
  if(!item) return 0;
  if(item.id === "it_tiao"){
    if(customerType === "選手") return Number(state.pricing.athleteFee)||0;
    const th = byId(state.therapists, therapistId);
    const lvl = th ? th.level : "A";
    return Number(state.pricing.levelFee[lvl])||0;
  }
  return Number(item.price)||0;
}
function findTier(tiers, n){
  return tiers.slice().sort((a,b)=>a.min-b.min).find(t => n >= t.min && n <= t.max) || null;
}
function monthTransactions(monthKey){
  return state.transactions.filter(t => monthKeyOf(t.date) === monthKey);
}
function computeTherapistMonthStats(therapistId, monthKey){
  const txs = monthTransactions(monthKey).filter(t => t.therapistId === therapistId);
  const tiaoTx = txs.filter(t => t.itemId === "it_tiao");
  const treatmentCount = tiaoTx.reduce((s,t)=>s+(Number(t.qty)||0),0);
  const treatmentRevenue = tiaoTx.reduce((s,t)=>s+(Number(t.amount)||0),0);
  const tier = findTier(state.commission.treatmentTiers, treatmentCount);
  const suggestedRate = tier ? tier.rate : 0;
  const suggestedTierBonus = tier ? (tier.bonus||0) : 0;

  const pillowTx = txs.filter(t => t.itemId === "it_pillow");
  const pillowQty = pillowTx.reduce((s,t)=>s+(Number(t.qty)||0),0);
  const pillowTier = findTier(state.commission.pillowTiers, pillowQty);
  const suggestedPillowAmount = pillowTier ? (pillowQty * pillowTier.rate + (pillowTier.bonus||0)) : 0;

  const otherTx = txs.filter(t => t.itemId !== "it_tiao" && t.itemId !== "it_pillow");
  let otherDetail = [];
  let otherTotal = 0;
  otherTx.forEach(t=>{
    const rate = state.commission.otherRates[t.itemId] || 0;
    const amt = rate * (Number(t.qty)||0);
    otherTotal += amt;
    if(amt !== 0){
      const existing = otherDetail.find(d=>d.itemName===t.itemName);
      if(existing){ existing.qty += Number(t.qty)||0; existing.amount += amt; }
      else otherDetail.push({itemName:t.itemName, qty:Number(t.qty)||0, amount:amt});
    }
  });

  return {treatmentCount, treatmentRevenue, suggestedRate, suggestedTierBonus, pillowQty, suggestedPillowAmount, otherTotal, otherDetail, tierLabel: tier?tier.label:"—"};
}
function getSettlementOverride(monthKey, therapistId){
  const m = state.settlements[monthKey];
  return (m && m[therapistId]) ? m[therapistId] : null;
}
function computeTherapistSettlement(therapistId, monthKey){
  const stats = computeTherapistMonthStats(therapistId, monthKey);
  const ov = getSettlementOverride(monthKey, therapistId);
  const rate = ov && ov.rate !== undefined && ov.rate !== null ? Number(ov.rate) : stats.suggestedRate;
  const treatmentPay = stats.treatmentRevenue * rate + stats.suggestedTierBonus;
  const pillowPay = ov && ov.pillow !== undefined && ov.pillow !== null ? Number(ov.pillow) : stats.suggestedPillowAmount;
  const teamBonus = ov && ov.teamBonus !== undefined && ov.teamBonus !== null ? Number(ov.teamBonus) : 0;
  const total = treatmentPay + pillowPay + stats.otherTotal + teamBonus;
  return {...stats, rate, treatmentPay, pillowPay, teamBonus, total};
}
function calcAge(birthDate, birthYear){
  const today = new Date();
  if(birthDate){
    const d = new Date(birthDate);
    if(!isNaN(d.getTime())){
      let age = today.getFullYear() - d.getFullYear();
      const m = today.getMonth() - d.getMonth();
      if(m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
      return {age, approx:false};
    }
  }
  const y = Number(birthYear);
  if(y && y > 1900 && y <= today.getFullYear()){
    return {age: today.getFullYear()-y, approx:true};
  }
  return null;
}
function fmtAge(birthDate, birthYear){
  const r = calcAge(birthDate, birthYear);
  if(!r) return "—";
  return r.approx ? `約 ${r.age} 歲` : `${r.age} 歲`;
}
function nextCustomerCode(){
  let maxLetter = "A", maxNum = 0, found = false;
  state.customers.forEach(c=>{
    const m = (c.code||"").trim().match(/^([A-Za-z])(\d{3})$/);
    if(!m) return;
    found = true;
    const letter = m[1].toUpperCase();
    const num = parseInt(m[2], 10);
    if(letter > maxLetter || (letter === maxLetter && num > maxNum)){
      maxLetter = letter; maxNum = num;
    }
  });
  if(!found) return "A001";
  let nextNum = maxNum + 1;
  let nextLetter = maxLetter;
  if(nextNum > 999){
    nextNum = 1;
    nextLetter = String.fromCharCode(maxLetter.charCodeAt(0) + 1);
  }
  return nextLetter + String(nextNum).padStart(3, "0");
}

function currentMonthRange(){

  const from = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m+1, 0).getDate();
  const to = `${y}-${String(m+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return {from, to};
}

function applyTxFilters(){
  txFilters.from = document.getElementById("txFrom").value;
  txFilters.to = document.getElementById("txTo").value;
  txFilters.therapistId = document.getElementById("txTherapist").value;
  txFilters.category = document.getElementById("txCategory").value;
  txFilters.keyword = document.getElementById("txKeyword").value;
  txPage = 1;
  renderTxTable();
}
function filteredTx(){
  return state.transactions.filter(t=>{
    if(txFilters.from && t.date < txFilters.from) return false;
    if(txFilters.to && t.date > txFilters.to) return false;
    if(txFilters.therapistId && t.therapistId !== txFilters.therapistId) return false;
    if(txFilters.category && t.category !== txFilters.category) return false;
    if(txFilters.keyword){
      const k = txFilters.keyword.toLowerCase();
      const hay = [t.customerName,t.itemName,t.note,t.therapistName].join(" ").toLowerCase();
      if(!hay.includes(k)) return false;
    }
    return true;
  }).sort((a,b)=> (b.date+b.id).localeCompare(a.date+a.id));
}

  if(document.getElementById("txPrev")) document.getElementById("txPrev").addEventListener("click", ()=>{txPage--; renderTxTable();});

function exportTransactionsCsv(){
  const list = filteredTx();
  const header = ["日期","客戶","類別","項目","調理師","客戶類別","數量","單價","折扣","金額","付款方式","備註"];
  const rows = list.map(t=>[t.date,t.customerName,t.category,t.itemName,t.therapistName,t.customerType,t.qty,t.unitPrice,t.discount,t.amount,t.payment,t.note]);
  downloadCsv("消費紀錄.csv", header, rows);
  toast("已匯出 CSV", "success");
}
function downloadCsv(filename, header, rows){
  const esc = v => { v = (v===undefined||v===null) ? "" : String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  const csv = [header.map(esc).join(","), ...rows.map(r=>r.map(esc).join(","))].join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function txCustomerLabel(t){

    onOpen(){
      attachCustomerAutocomplete();
      document.getElementById("txfCategory").addEventListener("change", ()=>refreshTxItemOptions());
      document.getElementById("txfItem").addEventListener("change", ()=>{ toggleCustomerTypeVisibility(); recalcTxAmount(); });
      document.getElementById("txfTherapist").addEventListener("change", recalcTxAmount);
      document.getElementById("txfCustomerType").addEventListener("change", recalcTxAmount);
      document.getElementById("txfQty").addEventListener("input", updateAmountField);
      document.getElementById("txfDiscount").addEventListener("input", updateAmountField);
      document.getElementById("txfUnitPrice").addEventListener("input", updateAmountField);
      refreshTxItemOptions(d?d.itemId:undefined);
      if(d){ document.getElementById("txfUnitPrice").value = d.unitPrice; document.getElementById("txfAmount").value = d.amount; }
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("txSaveBtn").addEventListener("click", ()=> saveTransactionForm(tx));
    }
  });
}
function saveTransactionForm(existing){
  const form = document.getElementById("txForm");
  const fd = new FormData(form);
  const date = fd.get("date");
  if(!date){ toast("請選擇日期", "error"); return; }
  const itemId = fd.get("itemId");
  const item = byId(state.items, itemId);
  if(!item){ toast("請選擇項目", "error"); return; }
  const customerId = document.getElementById("txfCustomerId").value || "";
  const customerSearchVal = document.getElementById("txfCustomerSearch").value.trim();
  let customerName = customerSearchVal;
  if(customerId){
    const matched = byId(state.customers, customerId);
    if(matched) customerName = matched.name;
  }
  const therapistId = fd.get("therapistId")||"";
  const therapist = byId(state.therapists, therapistId);

  const record = {
    id: existing ? existing.id : uid("tx"),
    date, customerId, customerName,
    therapistId, therapistName: therapist?therapist.name:"",
    category: fd.get("category"),
    itemId, itemName: item.name,
    customerType: item.id==="it_tiao" ? fd.get("customerType") : "",
    qty: Number(fd.get("qty"))||1,
    unitPrice: Number(fd.get("unitPrice"))||0,
    discount: Number(fd.get("discount"))||0,
    amount: Number(fd.get("amount"))||0,
    payment: fd.get("payment"),
    note: fd.get("note")||"",
  };
  if(existing){
    const idx = state.transactions.findIndex(t=>t.id===existing.id);
    state.transactions[idx] = record;
  } else {
    state.transactions.push(record);
  }
  saveState();
  closeModal();
  toast(existing?"已更新消費紀錄":"已新增消費紀錄", "success");
  if(activeTab==="transactions") renderTxTable();
  if(activeTab==="dashboard") renderDashboard();
}
function deleteTransaction(id){
  confirmModal({
    title:"刪除消費紀錄", message:"確定要刪除這筆消費紀錄嗎？此動作無法復原。", confirmText:"刪除", danger:true,
    onConfirm(){
      state.transactions = state.transactions.filter(t=>t.id!==id);
      saveState();
      toast("已刪除消費紀錄","success");
      renderTxTable();
    }
  });
}

function requireManagerPassword(actionLabel, callback){
  if(!(state.security && state.security.hash)){ callback(); return; }
  openModal({
    title:"需要店長密碼",
    bodyHTML:`<div class="field"><label>請輸入店長密碼以${escapeHtml(actionLabel)}</label><input type="password" id="rmpInput" autocomplete="off"></div>`,
    footHTML:`<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="rmpBtn">確認</button>`,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      const doConfirm = async ()=>{
        const pw = document.getElementById("rmpInput").value;
        const hash = await hashPassword(pw, state.security.salt);
        if(hash !== state.security.hash){ toast("密碼不正確","error"); return; }
        closeModal();
        callback();
      };
      document.getElementById("rmpBtn").addEventListener("click", doConfirm);
      document.getElementById("rmpInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doConfirm(); });
    }
  });

function openSetTherapistPinModal(t){
  if(!CRYPTO_OK){ toast("此瀏覽器不支援此功能，請改用較新版本的 Chrome、Edge 或 Firefox","error"); return; }
  openModal({
    title: `設定「${t.name}」的查薪 PIN`,
    bodyHTML: `
      <div class="note-box mb8">設定後，此調理師可於「我的薪資查詢」頁面用姓名＋此 PIN 自行查看個人薪資，無法看到其他人資料或店內營收。</div>

      <div class="field"><label>再次輸入 PIN</label><input type="password" id="thPin2" autocomplete="off"></div>
      ${t.pinHash ? `<div class="faint">目前已設定過 PIN，儲存後將取代舊 PIN。</div>` : ""}
    `,
    footHTML: `
      ${t.pinHash ? `<button class="btn btn-danger" id="thPinClearBtn" style="margin-right:auto;">移除 PIN</button>` : ""}
      <button class="btn btn-ghost" data-close>取消</button>
      <button class="btn btn-primary" id="thPinSaveBtn">儲存 PIN</button>
    `,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("thPinSaveBtn").addEventListener("click", async ()=>{
        const p1 = document.getElementById("thPin1").value;
        const p2 = document.getElementById("thPin2").value;
        if(!p1 || p1.length<4){ toast("PIN 至少需 4 碼","error"); return; }
        if(p1!==p2){ toast("兩次輸入不一致","error"); return; }
        const salt = randomSaltB64();
        const hash = await hashPassword(p1, salt);
        const idx = state.therapists.findIndex(x=>x.id===t.id);
        if(idx<0){ toast("找不到此調理師","error"); return; }
        state.therapists[idx].pinHash = hash;
        state.therapists[idx].pinSalt = salt;
        saveState(); closeModal(); toast("已設定查薪 PIN","success");
        if(activeTab==="therapists") renderTherapists();
      });
      const clearBtn = document.getElementById("thPinClearBtn");
      if(clearBtn) clearBtn.addEventListener("click", ()=>{
        const idx = state.therapists.findIndex(x=>x.id===t.id);
        if(idx>=0){ state.therapists[idx].pinHash=null; state.therapists[idx].pinSalt=null; saveState(); }
        closeModal(); toast("已移除查薪 PIN","success");
        if(activeTab==="therapists") renderTherapists();
      });
    }
  });
}

function openItemModal(i){
  openModal({
    title: i?"編輯項目":"新增項目",
    bodyHTML: itemFormBody(i),
    footHTML: `<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="itemSaveBtn">${i?'儲存變更':'新增項目'}</button>`,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("itemSaveBtn").addEventListener("click", ()=>{
        const fd = new FormData(document.getElementById("itemForm"));
        const name = (fd.get("name")||"").trim();
        if(!name){ toast("請輸入項目名稱","error"); return; }
        const record = { id: i?i.id:uid("it"), category: fd.get("category"), name, price: Number(fd.get("price"))||0 };
        if(i){ const idx = state.items.findIndex(x=>x.id===i.id); state.items[idx] = {...state.items[idx], ...record}; }
        else {
          state.items.push(record);
          state.commission.otherRates[record.id] = 0;
          state.costs[record.id] = 0;
        }
        saveState(); closeModal(); toast(i?"已更新項目":"已新增項目","success"); renderItemsTable();
      });
    }
  });
}
function deleteItem(id){
  const used = state.transactions.some(t=>t.itemId===id);
  confirmModal({
    title:"刪除項目",
    message: used? "此項目已有消費紀錄使用，仍可刪除但歷史紀錄名稱會保留。確定要刪除嗎？" : "確定要刪除這個項目嗎？",
    confirmText:"刪除", danger:true,
    onConfirm(){
      state.items = state.items.filter(i=>i.id!==id);
      delete state.commission.otherRates[id];
      delete state.costs[id];
      saveState(); toast("已刪除項目","success"); renderItemsTable();
    }
  });
}

function collectTierInputs(wrapId, tiers){

let settlementMonth = new Date().toISOString().slice(0,7);
function renderSettlement(){
  const el = document.getElementById("panel-settlement");
  document.getElementById("topbarActions").innerHTML = `
    <button class="btn btn-ghost" id="settlementPrint">列印／匯出</button>
  `;
  el.innerHTML = `
    <div class="card card-pad">
      <div class="toolbar">
        <div class="field"><label>結算月份</label><input type="month" id="settlementMonthInput" value="${settlementMonth}"></div>
        <button class="btn btn-primary" id="settlementRecalc">重新試算</button>
        <button class="btn btn-accent" id="settlementSaveAll">儲存本月所有調整</button>
      </div>
      <div id="settlementStudioSummary"></div>
      <div id="settlementTableWrap" class="mt16"></div>
    </div>
  `;
  document.getElementById("settlementMonthInput").addEventListener("change", (e)=>{ settlementMonth = e.target.value; renderSettlementTable(); });
  document.getElementById("settlementRecalc").addEventListener("click", renderSettlementTable);
  document.getElementById("settlementSaveAll").addEventListener("click", saveSettlementAll);
  document.getElementById("settlementPrint").addEventListener("click", ()=> window.print());
  renderSettlementTable();
}
function renderSettlementTable(){
  const monthKey = settlementMonth;
  const activeTherapists = state.therapists.filter(t=>t.status==="active");
  const rows = activeTherapists.map(t=>({th:t, s:computeTherapistSettlement(t.id, monthKey)}));

  const txs = monthTransactions(monthKey);
  const totalRevenue = txs.reduce((s,t)=>s+(Number(t.amount)||0),0);
  const payroll = rows.reduce((s,r)=>s+r.s.total,0);
  const goodsCost = txs.filter(t=>t.category==="商品").reduce((s,t)=>s + (state.costs[t.itemId]||0)*(Number(t.qty)||0), 0);
  const profit = totalRevenue - payroll - goodsCost;

  document.getElementById("settlementStudioSummary").innerHTML = `
    <div class="grid grid-4 mt16">
      <div class="card stat-card"><div class="label">當月總收入</div><div class="value">${fmtMoney(totalRevenue)}</div></div>
      <div class="card stat-card"><div class="label">人事支出（薪資合計）</div><div class="value">${fmtMoney(payroll)}</div></div>
      <div class="card stat-card"><div class="label">商品進貨成本</div><div class="value">${fmtMoney(goodsCost)}</div><div class="hint">依「項目與價目」成本設定估算</div></div>
      <div class="card stat-card"><div class="label">估計獲利</div><div class="value" style="color:${profit>=0?'var(--success)':'var(--danger)'}">${fmtMoney(profit)}</div></div>
    </div>
  `;

  document.getElementById("settlementTableWrap").innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>調理師</th><th class="num">調理次數</th><th class="num">調理金額</th><th class="num">建議比例</th>
          <th class="num">分潤比例(可調整)</th><th class="num">調理分潤</th>
          <th class="num">枕頭數量</th><th class="num">枕頭分潤(可調整)</th>
          <th class="num">其他項目分潤</th><th class="num">團隊獎金(可調整)</th>
          <th class="num">總薪資</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.length ? rows.map(({th,s})=>`
            <tr data-settle-row="${th.id}">
              <td>${escapeHtml(th.name)} <span class="pill pill-${th.level}">${th.level}</span></td>
              <td class="num mono">${fmtNum(s.treatmentCount)}</td>
              <td class="num mono">${fmtMoney(s.treatmentRevenue)}</td>
              <td class="num faint">${(s.suggestedRate*100).toFixed(0)}%${s.suggestedTierBonus?`+${fmtMoney(s.suggestedTierBonus)}`:''}</td>
              <td class="num"><input type="number" step="0.01" min="0" max="1" data-settle="rate" value="${s.rate}" style="max-width:90px; margin-left:auto;"></td>
              <td class="num mono" data-out="treatmentPay">${fmtMoney(s.treatmentPay)}</td>
              <td class="num mono">${fmtNum(s.pillowQty)}</td>
              <td class="num"><input type="number" min="0" data-settle="pillow" value="${s.pillowPay}" style="max-width:100px; margin-left:auto;"></td>
              <td class="num mono" title="${s.otherDetail.map(d=>d.itemName+'×'+d.qty+'='+Math.round(d.amount)).join(', ')||'—'}">${fmtMoney(s.otherTotal)}</td>
              <td class="num"><input type="number" min="0" data-settle="teamBonus" value="${s.teamBonus}" style="max-width:100px; margin-left:auto;"></td>
              <td class="num mono" style="font-weight:700;" data-out="total">${fmtMoney(s.total)}</td>
              <td><button class="btn btn-ghost btn-sm" data-reset-settle="${th.id}">還原建議值</button></td>
            </tr>`).join("") : `<tr class="empty-row"><td colspan="12">目前沒有在職調理師</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="faint mt12">提示：滑鼠移到「其他項目分潤」欄位可看到明細；調整「分潤比例」「枕頭分潤」「團隊獎金」後，需按上方「儲存本月所有調整」才會保留。</div>
  `;

  document.querySelectorAll('[data-settle-row]').forEach(row=>{
    const thId = row.dataset.settleRow;
    row.querySelectorAll('[data-settle]').forEach(inp=>{
      inp.addEventListener("input", ()=> recomputeSettleRow(thId, monthKey));
    });
    const resetBtn = row.querySelector('[data-reset-settle]');
    if(resetBtn) resetBtn.addEventListener("click", ()=>{
      if(state.settlements[monthKey]) delete state.settlements[monthKey][thId];
      saveState();
      renderSettlementTable();
    });
  });
}
function recomputeSettleRow(thId, monthKey){
  const row = document.querySelector(`[data-settle-row="${thId}"]`);
  const stats = computeTherapistMonthStats(thId, monthKey);
  const rate = Number(row.querySelector('[data-settle="rate"]').value)||0;
  const pillow = Number(row.querySelector('[data-settle="pillow"]').value)||0;
  const teamBonus = Number(row.querySelector('[data-settle="teamBonus"]').value)||0;
  const treatmentPay = stats.treatmentRevenue*rate + stats.suggestedTierBonus;
  const total = treatmentPay + pillow + stats.otherTotal + teamBonus;
  row.querySelector('[data-out="treatmentPay"]').textContent = fmtMoney(treatmentPay);
  row.querySelector('[data-out="total"]').textContent = fmtMoney(total);
}
function saveSettlementAll(){
  const monthKey = settlementMonth;
  if(!state.settlements[monthKey]) state.settlements[monthKey] = {};
  document.querySelectorAll('[data-settle-row]').forEach(row=>{
    const thId = row.dataset.settleRow;
    state.settlements[monthKey][thId] = {
      rate: Number(row.querySelector('[data-settle="rate"]').value)||0,
      pillow: Number(row.querySelector('[data-settle="pillow"]').value)||0,
      teamBonus: Number(row.querySelector('[data-settle="teamBonus"]').value)||0,
    };
  });
  saveState();
  toast("已儲存本月薪資結算資料","success");
  renderSettlementTable();
}

let myPayMonth = new Date().toISOString().slice(0,7);
function renderMyPay(){
  const el = document.getElementById("panel-mypay");
  document.getElementById("topbarActions").innerHTML = "";
  if(!myPayTherapistId){
    renderMyPayLogin(el);
    return;
  }
  const th = byId(state.therapists, myPayTherapistId);

  document.getElementById("topbarActions").innerHTML = `<button class="btn btn-ghost" id="myPayLogoutBtn">登出</button>`;
  renderMyPayDashboard(el, th);
  document.getElementById("myPayLogoutBtn").addEventListener("click", ()=>{ myPayTherapistId = null; renderMyPay(); });
}
function renderMyPayLogin(el){
  const options = state.therapists.filter(t=>t.status==="active").map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
  el.innerHTML = `
    <div class="card card-pad" style="max-width:440px; margin:30px auto; text-align:center;">
      <div style="font-size:32px; margin-bottom:6px;">🔑</div>
      <h3>調理師個人薪資查詢</h3>
      <p class="faint mt8" style="line-height:1.7;">請選擇您的姓名並輸入個人查薪 PIN，僅能查看您自己的薪資資料，無法看到其他調理師或店內營收資訊。</p>
      <div class="field mt16" style="text-align:left;"><label>選擇姓名</label><select id="myPaySelect">${options || '<option value="">尚無在職調理師</option>'}</select></div>
      <div class="field" style="text-align:left;"><label>個人 PIN</label><input type="password" id="myPayPinInput" autocomplete="off"></div>
      <button class="btn btn-primary w-100 mt8" id="myPayLoginBtn">查詢我的薪資</button>
      <p class="faint mt12" style="line-height:1.6;">尚未設定 PIN 嗎？請洽店長於「調理師管理」頁面為您設定。</p>
    </div>
  `;
  if(!CRYPTO_OK){
    el.innerHTML = `<div class="card card-pad" style="max-width:440px; margin:30px auto; text-align:center;"><div style="font-size:32px;">⚠️</div><h3 class="mt8">此瀏覽器不支援此功能</h3><p class="faint mt8">請改用較新版本的 Chrome、Edge 或 Firefox。</p></div>`;
    return;
  }
  const doLogin = async ()=>{
    const thId = document.getElementById("myPaySelect").value;
    const pin = document.getElementById("myPayPinInput").value;
    const th = byId(state.therapists, thId);
    if(!th){ toast("請選擇姓名","error"); return; }
    if(!th.pinHash){ toast("此調理師尚未設定查薪 PIN，請洽店長協助設定","error"); return; }
    if(!pin){ toast("請輸入 PIN","error"); return; }
    const hash = await hashPassword(pin, th.pinSalt);
    if(hash !== th.pinHash){ toast("PIN 不正確","error"); return; }
    myPayTherapistId = th.id;
    toast("查詢成功","success");
    renderMyPay();
  };
  document.getElementById("myPayLoginBtn").addEventListener("click", doLogin);
  document.getElementById("myPayPinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
}

        </div>
        <div class="field" style="margin-bottom:0;"><label>查詢月份</label><input type="month" id="myPayMonthInput" value="${myPayMonth}"></div>

/* =======================================================
   13. 系統設定／備份
   ======================================================= */
function renderBackup(){
  const el = document.getElementById("panel-backup");
  el.innerHTML = `
    <div class="card card-pad">
      <div class="section-head"><h3>工作室名稱</h3></div>
      <div class="form-row">
        <div class="field"><label>顯示名稱（僅用於檔案命名等功能，不會顯示在標誌圖片內）</label><input type="text" id="studioNameInput" value="${escapeHtml(state.meta.studioName)}"></div>
      </div>
      <button class="btn btn-accent btn-sm" id="saveStudioName">儲存名稱</button>
    </div>

    <div class="card card-pad mt16">
      <div class="section-head"><h3>機密資料保護（店長密碼）</h3><span class="desc">保護「儀表板」「月結算薪資」「分潤規則」頁面，需輸入密碼才能檢視</span></div>
      ${!CRYPTO_OK ? `<div class="note-box">此瀏覽器不支援密碼保護功能，請改用較新版本的 Chrome、Edge 或 Firefox。</div>` :
        (state.security && state.security.hash ? `
          <div class="info-box">已啟用密碼保護，員工開啟「儀表板」「月結算薪資」「分潤規則」時需輸入密碼。<br>
            密碼提示：${state.security.hint ? '已設定' : '未設定'}　／　救援問題：${state.security.question ? '已設定' : '未設定'}
          </div>
          <div class="small-btn-row mt12">
            <button class="btn btn-ghost" id="changePwBtn">變更密碼／提示／救援問題</button>
            <button class="btn btn-danger" id="disablePwBtn">取消密碼保護</button>
          </div>
        ` : `
          <div class="note-box">尚未設定，目前任何人都能檢視儀表板、月結算薪資與分潤規則資料。</div>
          <div class="form-row mt12">
            <div class="field"><label>設定新密碼（至少 4 碼）</label><input type="password" id="newPwInput1" autocomplete="off"></div>
            <div class="field"><label>再次輸入</label><input type="password" id="newPwInput2" autocomplete="off"></div>
          </div>
          <div class="field"><label>密碼提示（選填）<span class="help">忘記密碼時會直接顯示給您看</span></label><input type="text" id="newPwHint" placeholder="例如：我家貓咪的名字"></div>
          <div class="form-row">
            <div class="field"><label>救援問題（選填）</label><input type="text" id="newPwQuestion" placeholder="例如：我小學的名稱？"></div>
            <div class="field"><label>救援問題答案</label><input type="text" id="newPwAnswer" autocomplete="off"></div>
          </div>
          <button class="btn btn-accent btn-sm" id="setPwBtn">啟用密碼保護</button>
        `)
      }
      <div class="faint mt12" style="line-height:1.6;">說明：此為畫面層級的保護，可避免同事於工作站上不小心看到營收與薪資資料；但因為本工具沒有伺服器，資料本身仍以未加密方式存放在瀏覽器中。若需要防止技術人員以瀏覽器開發者工具查看資料，需改用具備伺服器與帳號權限的系統。</div>
    </div>

    <div class="card card-pad mt16">
      <div class="section-head"><h3>資料備份與還原</h3><span class="desc">所有資料僅儲存在目前這台電腦、這個瀏覽器中，請定期備份</span></div>
      <div class="small-btn-row">
        <button class="btn btn-primary" id="exportJsonBtn">匯出備份檔（JSON）</button>
        <button class="btn btn-ghost" id="importJsonBtn">匯入備份檔</button>
        <input type="file" id="importFileInput" accept="application/json" class="hidden">
        <button class="btn btn-danger" id="resetAllBtn">清空所有資料</button>
      </div>
      <div class="note-box mt12">匯入備份檔會「完全取代」目前的所有資料，建議匯入前先匯出目前資料備份。</div>
      <div class="faint mt8">最後更新時間：${state.meta.updatedAt ? new Date(state.meta.updatedAt).toLocaleString('zh-Hant-TW') : '—'}</div>
    </div>

    <div class="card card-pad mt16">
      <div class="section-head"><h3>使用說明</h3></div>
      <ol style="line-height:1.9; padding-left:20px; color:var(--ink);">
        <li>先於「調理師管理」建立調理師並設定等級（A～D）。</li>
        <li>於「項目與價目」確認各等級的一般客人調理費、選手固定費用，以及商品／其他項目單價。</li>
        <li>於「分潤規則」設定調理量分潤比例、枕頭銷售分潤與其他項目分潤金額。</li>
        <li>每天於「消費紀錄」新增客戶消費，系統會自動依「客戶類別＋調理師等級」試算單價。</li>
        <li>月底於「月結算薪資」選擇月份，系統自動試算每位調理師薪資，可微調後「儲存本月所有調整」。</li>
      </ol>
    </div>
  `;
  document.getElementById("saveStudioName").addEventListener("click", ()=>{
    state.meta.studioName = document.getElementById("studioNameInput").value || "工作室記帳系統";
    saveState();
    document.getElementById("brandName").textContent = state.meta.studioName;
    toast("已儲存工作室名稱","success");
  });
  document.getElementById("exportJsonBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStamp = todayStr();
    a.href = url; a.download = `${state.meta.studioName||'工作室'}_備份_${dateStamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("已匯出備份檔","success");
  });
  document.getElementById("importJsonBtn").addEventListener("click", ()=> document.getElementById("importFileInput").click());
  document.getElementById("importFileInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !data.items || !data.transactions){ toast("檔案格式不正確","error"); return; }
        confirmModal({
          title:"匯入備份檔", message:"匯入將完全取代目前資料，確定要繼續嗎？", confirmText:"匯入並取代", danger:true,
          onConfirm(){
            state = data;
            if(!state.security) state.security = {hash:null, salt:null};
            sensitiveUnlocked = false;
            saveState();
            toast("已匯入備份資料","success");
            switchTab("dashboard");
          }
        });
      }catch(err){ toast("讀取檔案失敗："+err.message, "error"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });
  document.getElementById("resetAllBtn").addEventListener("click", ()=>{
    confirmModal({
      title:"清空所有資料", message:"此動作將清除所有客戶、調理師、消費紀錄與設定，且無法復原。建議先匯出備份。確定要清空嗎？", confirmText:"清空所有資料", danger:true,
      onConfirm(){
        state = defaultState();
        sensitiveUnlocked = false;
        saveState();
        toast("已重置為範例資料","success");
        switchTab("dashboard");
      }
    });
  });

  if(CRYPTO_OK){
    const setPwBtn = document.getElementById("setPwBtn");
    if(setPwBtn) setPwBtn.addEventListener("click", async ()=>{
      const p1 = document.getElementById("newPwInput1").value;
      const p2 = document.getElementById("newPwInput2").value;
      if(!p1 || p1.length<4){ toast("密碼至少需 4 碼","error"); return; }
      if(p1!==p2){ toast("兩次密碼輸入不一致","error"); return; }
      const hint = (document.getElementById("newPwHint").value||"").trim();
      const question = (document.getElementById("newPwQuestion").value||"").trim();
      const answer = document.getElementById("newPwAnswer").value||"";
      const salt = randomSaltB64();
      const hash = await hashPassword(p1, salt);
      let qHash = null, qSalt = null;
      if(question && answer){
        qSalt = randomSaltB64();
        qHash = await hashPassword(normalizeAnswer(answer), qSalt);
      }
      state.security = {hash, salt, hint, question: question&&answer?question:"", qHash, qSalt};
      saveState();
      toast("已啟用密碼保護","success");
      renderBackup();
    });
    const changePwBtn = document.getElementById("changePwBtn");
    if(changePwBtn) changePwBtn.addEventListener("click", openChangePasswordModal);
    const disablePwBtn = document.getElementById("disablePwBtn");
    if(disablePwBtn) disablePwBtn.addEventListener("click", openDisablePasswordModal);
  }
}
function openChangePasswordModal(){
  const sec = state.security;
  openModal({
    title:"變更店長密碼",
    bodyHTML:`
      <div class="field"><label>目前密碼</label><input type="password" id="cpOld" autocomplete="off"></div>
      <div class="field"><label>新密碼（至少 4 碼）</label><input type="password" id="cpNew1" autocomplete="off"></div>
      <div class="field"><label>再次輸入新密碼</label><input type="password" id="cpNew2" autocomplete="off"></div>
      <div class="divider"></div>
      <div class="field"><label>密碼提示（選填）</label><input type="text" id="cpHint" value="${escapeHtml(sec.hint||'')}"></div>
      <div class="field"><label>救援問題（選填，留空表示不使用）</label><input type="text" id="cpQuestion" value="${escapeHtml(sec.question||'')}"></div>
      <div class="field"><label>救援問題答案<span class="help">若要更換救援問題請重新輸入答案；若不更動問題可留空</span></label><input type="text" id="cpAnswer" autocomplete="off"></div>
    `,
    footHTML: `<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-primary" id="cpSaveBtn">儲存新密碼</button>`,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("cpSaveBtn").addEventListener("click", async ()=>{
        const oldPw = document.getElementById("cpOld").value;
        const n1 = document.getElementById("cpNew1").value;
        const n2 = document.getElementById("cpNew2").value;
        const oldHash = await hashPassword(oldPw, state.security.salt);
        if(oldHash !== state.security.hash){ toast("目前密碼不正確","error"); return; }
        if(!n1 || n1.length<4){ toast("新密碼至少需 4 碼","error"); return; }
        if(n1!==n2){ toast("兩次新密碼輸入不一致","error"); return; }
        const hint = (document.getElementById("cpHint").value||"").trim();
        const question = (document.getElementById("cpQuestion").value||"").trim();
        const answer = document.getElementById("cpAnswer").value||"";
        const salt = randomSaltB64();
        const hash = await hashPassword(n1, salt);
        let qHash = sec.qHash, qSalt = sec.qSalt;
        if(question && answer){
          qSalt = randomSaltB64();
          qHash = await hashPassword(normalizeAnswer(answer), qSalt);
        } else if(!question){
          qHash = null; qSalt = null;
        }
        state.security = {hash, salt, hint, question: question||"", qHash, qSalt};
        saveState();
        closeModal();
        toast("已變更密碼","success");
        if(activeTab==="backup") renderBackup();
      });
    }
  });
}
function openDisablePasswordModal(){
  openModal({
    title:"取消密碼保護",
    bodyHTML:`<div class="note-box mb8">取消後，任何人都能檢視儀表板、月結算薪資與分潤規則頁面，請確認目前密碼。</div><div class="field"><label>目前密碼</label><input type="password" id="dpOld" autocomplete="off"></div>`,
    footHTML: `<button class="btn btn-ghost" data-close>取消</button><button class="btn btn-danger" id="dpSaveBtn">確認取消保護</button>`,
    onOpen(){
      document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click", closeModal));
      document.getElementById("dpSaveBtn").addEventListener("click", async ()=>{
        const oldPw = document.getElementById("dpOld").value;
        const oldHash = await hashPassword(oldPw, state.security.salt);
        if(oldHash !== state.security.hash){ toast("密碼不正確","error"); return; }
        state.security = {hash:null, salt:null, hint:"", question:"", qHash:null, qSalt:null};
        saveState();
        closeModal();
        toast("已取消密碼保護","success");
        if(activeTab==="backup") renderBackup();
      });
    }
  });
}

/* =======================================================
   14. 全域點擊委派（新增／編輯／刪除 按鈕）
   ======================================================= */
document.addEventListener("click", (e)=>{
  const jump = e.target.closest("[data-nav-jump]");
  if(jump){ switchTab(jump.dataset.navJump); return; }

  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  switch(action){
    case "add-transaction": openTransactionModal(null); break;
    case "edit-transaction": openTransactionModal(byId(state.transactions, id)); break;
    case "delete-transaction": deleteTransaction(id); break;
    case "add-customer": openCustomerModal(null); break;
    case "edit-customer": openCustomerModal(byId(state.customers, id)); break;
    case "delete-customer": deleteCustomer(id); break;
    case "add-therapist": openTherapistModal(null); break;
    case "edit-therapist": openTherapistModal(byId(state.therapists, id)); break;
    case "delete-therapist": deleteTherapist(id); break;
    case "set-therapist-pin": requireManagerPassword("設定調理師查薪 PIN", ()=> openSetTherapistPinModal(byId(state.therapists, id))); break;
    case "add-item": openItemModal(null); break;
    case "edit-item": openItemModal(byId(state.items, id)); break;
    case "delete-item": deleteItem(id); break;
  }
});

/* =======================================================
   15. 啟動
   ======================================================= */
const RENDERERS = {
  dashboard: renderDashboard,
  transactions: renderTransactions,
  customers: renderCustomers,
  therapists: renderTherapists,
  items: renderItems,
  commission: renderCommission,
  settlement: renderSettlement,
  mypay: renderMyPay,
  backup: renderBackup,
};

function buildShell(){
  const content = document.getElementById("content");
  content.innerHTML = TABS.map(t => `<div class="tab-panel" id="panel-${t.id}"></div>`).join("");
}

function init(){
  buildShell();
  renderNav();
  document.getElementById("brandName").textContent = state.meta.studioName || "工作室記帳系統";
  switchTab("dashboard");
}
init();

})();
</script>
